name: Numerical and encrypted protocol contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  encrypted-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned build and test dependencies
        run: |
          python -m pip install cmake==3.31.6 pytest==8.4.2 setuptools==80.9.0
          python -m pip install --no-build-isolation -e .
      - name: Build pinned OpenFHE and separated workers
        run: python scripts/build_backend.py --jobs 1
      - name: Require both native workers
        run: |
          test -x "$GITHUB_WORKSPACE/.runtime/bin/ciphershape-client"
          test -x "$GITHUB_WORKSPACE/.runtime/bin/ciphershape-server"
      - name: Verify numerical, failure and native protocol contracts
        env:
          CIPHERSHAPE_NATIVE: ${{ github.workspace }}/.runtime/bin
        run: python -m pytest -q -ra
      - name: Execute both applications with changed inputs over HTTP
        env:
          CIPHERSHAPE_NATIVE: ${{ github.workspace }}/.runtime/bin
        run: |
          python scripts/prove_dot.py
          ciphershape demo analytics --out runs/ci-analytics
          ciphershape demo model --out runs/ci-model
