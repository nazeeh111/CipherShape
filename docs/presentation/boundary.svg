<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="boundary-title boundary-desc" font-family="Arial"><title id="boundary-title">CipherShape client and server protocol inputs</title><desc id="boundary-desc">A client keeps its secret key and plaintext, sends two ciphertext inputs with public evaluation material to a separate native evaluator, receives seven encrypted outputs, and decrypts and checks them locally.</desc><defs><marker id="boundary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#164c82"/></marker></defs><rect width="100%" height="100%" fill="#f4f6fa"/>
<text x="32" y="38" fill="#164c82" font-size="17" font-weight="400">CipherShape / One actual synthetic analytics run</text>
<text x="32" y="100" fill="#142236" font-size="42" font-weight="700">Reorder the input. Keep it encrypted.</text>
<text x="32" y="144" fill="#526478" font-size="22" font-weight="400">Two vectors. Seven scalar outputs. Bounded CKKS.</text>
<rect x="32" y="190" width="464" height="330" fill="white" stroke="#a9b8c9"/>
<rect x="704" y="190" width="464" height="330" fill="white" stroke="#a9b8c9"/>
<line x1="496" y1="285" x2="704" y2="285" stroke="#164c82" stroke-width="2" marker-end="url(#boundary-arrow)"/><line x1="704" y1="425" x2="496" y2="425" stroke="#164c82" stroke-width="2" marker-end="url(#boundary-arrow)"/>
<text x="523" y="250" fill="#164c82" font-size="17" font-weight="400">2 ciphertext inputs</text>
<text x="519" y="391" fill="#164c82" font-size="17" font-weight="400">7 ciphertext outputs</text>
<text x="60" y="239" fill="#176844" font-size="28" font-weight="700">Client</text>
<text x="60" y="292" fill="#142236" font-size="23" font-weight="400">Secret key and plaintext</text>
<text x="60" y="330" fill="#526478" font-size="19" font-weight="400">Encrypt locally; keep the key here.</text>
<text x="60" y="430" fill="#176844" font-size="25" font-weight="700">Decrypt and check</text>
<text x="60" y="477" fill="#526478" font-size="17" font-weight="400">Synthetic fixtures/results disclosed intentionally.</text>
<text x="732" y="239" fill="#164c82" font-size="28" font-weight="700">Server protocol</text>
<text x="732" y="292" fill="#142236" font-size="22" font-weight="400">Public plan and evaluation keys</text>
<text x="732" y="330" fill="#526478" font-size="19" font-weight="400">Separate native evaluator process</text>
<text x="732" y="430" fill="#164c82" font-size="24" font-weight="700">No plaintext fallback</text>
<text x="732" y="477" fill="#526478" font-size="16" font-weight="400">Honest-but-curious; not malicious-server proof.</text>
<text x="32" y="588" fill="#142236" font-size="25" font-weight="700">Same mean x: 0.15 → 0.15</text>
<text x="32" y="631" fill="#176844" font-size="28" font-weight="700">Changed covariance: −0.05125 → 0.06125</text>
<text x="32" y="666" fill="#526478" font-size="18" font-weight="400">Client float references; fresh encrypted answers agree within the declared tolerance.</text>
<text x="32" y="720" fill="#526478" font-size="16" font-weight="400">Local HTTP demonstration. Shapes, code, keys for evaluation, sizes, timing and linkage are public.</text>
</svg>
